name: Docker Scout
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_run:
    workflows: [Docker Release]
    types: [completed]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Scan published image
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        with:
          command: cves
          image: registry://ralex91/razzia:latest
          platform: linux/amd64
          sarif-file: scout.sarif

      - name: Upload results to GitHub Security
        if: ${{ !env.ACT }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scout.sarif
          category: docker-scout

      - name: Fail on fixable critical or high vulnerabilities
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        with:
          command: cves
          image: registry://ralex91/razzia:latest
          platform: linux/amd64
          only-fixed: true
          only-severities: critical,high
          exit-code: true
