services:
  razzia:
    image: ralex91/razzia:latest
    ports:
      - "3000:3000"
    volumes:
      - ./config:/app/config
    env_file:
      - .env
    # Or set them inline instead of using an .env file:
    # environment:
    #   MANAGER_PASSWORD: "change-me"
    #   JWT_SECRET: "" # optional, 32+ characters
    #   PUID: 1000 # optional, user owning ./config
    #   PGID: 1000 # optional, group owning ./config
